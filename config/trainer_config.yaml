behaviors:
  CrewAgent:
    # MA-POCA: 4명을 한 팀으로 묶어 group reward + 중앙집중 critic으로 협력 학습.
    #   GameManager가 helperHeuristicOnly가 아니면 SimpleMultiAgentGroup에 4명 등록.
    #   (씬: 4명 모두 BehaviorType=Default)
    trainer_type: poca
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 0.01          # 엔트로피 계수 (협동게임은 탐색 중요)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 5

# ──────────────────────────────────────────────
# 커리큘럼 학습 — task 개수를 1개부터 점차 늘린다.
#   MissionManager.StartTaskSelectionPhase()에서
#   Academy.EnvironmentParameters.GetWithDefault("num_tasks", 1)로 읽는다.
#
#   각 task = WinSpecificCard("지정 색깔+숫자 카드가 든 트릭을 소유자가 이긴다").
#   task는 함장부터 시계방향 드래프트로 배정(가져가기/패스, 정책이 학습).
#
#   보상(그룹): task 완수 +1 / 실패 -1 (실패 시 즉시 미션 종료).
#   → 에피소드 그룹 리턴 ≈ (완수 task 수) - (실패 시 1). num_tasks개 모두 완수 시 +num_tasks.
#
#   진급 기준(threshold)은 그룹 평균 보상. num_tasks=1에서 mean=2*성공률-1 이므로
#   0.6 ≈ 성공률 80%. 단계가 올라갈수록 천장이 커지되 난이도도 오르므로 값은 튜닝 대상.
# ──────────────────────────────────────────────
environment_parameters:
  num_tasks:
    curriculum:
      - name: Stage1_1task
        completion_criteria:
          measure: reward
          behavior: CrewAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 1

      - name: Stage2_2tasks
        completion_criteria:
          measure: reward
          behavior: CrewAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8
        value: 2

      - name: Stage3_3tasks
        completion_criteria:
          measure: reward
          behavior: CrewAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1.0
        value: 3

      - name: Stage4_4tasks
        value: 4
