behaviors:
  CrewAgent:
    # MA-POCA: 4명을 한 팀으로 묶어 group reward + 중앙집중 critic으로 협력 학습.
    #   GameManager가 helperHeuristicOnly가 아니면 SimpleMultiAgentGroup에 4명 등록.
    #   (씬: 4명 모두 BehaviorType=Default)
    trainer_type: poca
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 0.01          # 엔트로피 계수 (협동게임은 탐색 중요)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 5

# ──────────────────────────────────────────────
# 커리큘럼 학습 (Option A) — task 개수를 1개부터 점차 늘린다.
#   MissionManager.StartTaskSelectionPhase()에서
#   Academy.EnvironmentParameters.GetWithDefault("num_tasks", 1)로 읽는다.
#
#   각 task = WinSpecificCard("지정 색깔+숫자 카드가 든 트릭을 소유자가 이긴다").
#   task는 함장부터 시계방향 드래프트로 배정(가져가기/패스, 정책이 학습).
#
#   보상(그룹, 정규화): task 완수 +1/N / 실패 -1(즉시 종료).  ← MissionManager.CompleteTask
#   → 전부 완수 +1.0(N무관), 부분완수 후 실패는 음수. 에피소드 리턴 범위 ≈ [-1,+1].
#     PPO advantage 스케일을 N과 무관하게 통일하는 것이 목적.
#
#   ※ 정규화 천장(ceiling_sim.py 2만 딜, coop휴리스틱 + 자기손패 드래프트):
#       N=1: +0.087(성공54%) / N=2: -0.355(22%) / N=3: -0.575(8%) / N=4: -0.674(2.5%)
#     정규화로 "부분점수가 난이도를 가리던" 문제는 해소(N↑ → 리턴↓ 단조). 그러나
#       (a) N≥2 천장이 음수 → 어떤 양수 reward threshold도 도달 불가,
#       (b) draft_explore_eps(ε)가 리턴을 더 끌어내려 ε=0 구간(progress>0.8) 전엔
#           N=1조차 reward threshold를 사실상 못 넘음 (ε=0.5에서 perfect play도 ≈ -0.08).
#     → 진급 기준을 measure: progress(누적스텝 비율)로 전환. 커리큘럼이 멈추지 않게 보장하고
#       아래 draft_explore_eps 스케줄(0–0.5 ε=1.0)과 정렬한다.
#   TODO(팀원 MCTS 천장 확정 후): coop휴리스틱은 N≥2 조율이 약해 위 천장을 과소평가한다.
#     MCTS 실제 상한이 나오면 N≥2 단계를 measure: reward + (MCTS천장 아래 음수 threshold)로 되돌릴 수 있음.
# ──────────────────────────────────────────────
environment_parameters:
  num_tasks:
    curriculum:
      - name: Stage1_1task
        completion_criteria:
          measure: progress
          behavior: CrewAgent
          threshold: 0.30      # 누적스텝 0–30%: N=1 (ε=1.0 탐색 구간 대부분). N=1은 이미 천장 근접.
          min_lesson_length: 100
        value: 1

      - name: Stage2_2tasks
        completion_criteria:
          measure: progress
          behavior: CrewAgent
          threshold: 0.55      # 30–55%: N=2 (ε 1.0→0.5 전환 구간 포함).
          min_lesson_length: 100
        value: 2

      - name: Stage3_3tasks
        completion_criteria:
          measure: progress
          behavior: CrewAgent
          threshold: 0.78      # 55–78%: N=3 (ε 0.5→0).
          min_lesson_length: 100
        value: 3

      - name: Stage4_4tasks
        value: 4               # 78–100%: N=4 (ε=0, 순수 정책).

  # ──────────────────────────────────────────────
  # 드래프트 ε-greedy 탐색 오버라이드 (Run6~, E 방법)
  #   MissionManager.AgentSelectTask()에서 읽어, 패스 가능 위치(cursor<3)의 take/pass를
  #   확률 ε으로 무시하고 랜덤 결정으로 대체한다.
  #   목표: "사령관 항상 선점(64%)" 균형을 깨고 value function이 다양한 owner 시나리오를 학습.
  #   ε=1.0 → cursor별 분포 ≈ 50/25/12.5/12.5 (현재 64/9/18/9 대비 대폭 다양화)
  #   ε=0.0 → 순수 정책 주도 (기존 동작)
  #   스케줄: progress 0→50% 구간 ε=1.0, 50→80% 구간 ε=0.5, 80→100% 구간 ε=0.0
  #           (progress = 누적 스텝 / max_steps)
  #
  #   ※ DraftShapeScale(Run5 shaping)은 이 변경과 함께 완전 제거됨(AssignTask에서 호출 삭제).
  # ──────────────────────────────────────────────
  draft_explore_eps:
    curriculum:
      - name: Eps_Full
        completion_criteria:
          measure: progress
          behavior: CrewAgent
          threshold: 0.5
          min_lesson_length: 10
        value: 1.0
      - name: Eps_Half
        completion_criteria:
          measure: progress
          behavior: CrewAgent
          threshold: 0.8
          min_lesson_length: 10
        value: 0.5
      - name: Eps_Zero
        value: 0.0

  # ──────────────────────────────────────────────
  # 특수 규칙 env 플래그 (Simulation 학습에서 켜면 합성 미션으로 적용 + 관측 노출).
  #   MissionManager.BuildSyntheticMissionFromEnv()가 읽어 currentMission에 주입 →
  #   enforce(CheckGlobalRule/통신/카드교환/순서토큰)·관측(특수규칙 32칸) 모두 동작.
  #   기본 0 = 규칙 없음(순수 트릭+드래프트 베이스). 각 항목 fixed value 또는 curriculum 가능.
  #
  #   global_rule:          0 없음 / 1~10 = GlobalMissionRule
  #                         (1 AllRocketsMustWin·2 NoNineWins·3 ColorOnesWinTwice·4 BalanceTricks·
  #                          5 RocketsInOrder·6 CommanderFirstAndLast·7 OmegaOnLastTrick·
  #                          8 OnePlayerFirstFourOnly·9 LeftOfPinkNineWinsAllPink·10 ColorOneWins)
  #   order_token_mode:     0 없음 / 1 숫자(①②) / 2 Ω / 3 화살표(›››)
  #   dead_zone:            1 = 통신 위치(최고/유일/최저) 비공개
  #   comm_disrupt_until:   N = N번째 트릭 전까지 통신 금지 (⚡N)
  #   no_comm_player:       1 = 특정인(사령관 왼쪽) 통신 불가 (M11)
  #   card_pass_after_first:1 = 첫 트릭 후 카드 1장 전달 (M12)
  #
  #   ※ commander_decision/distribution은 드래프트 흐름 변경이라 미구현(관측만). 추후 통합.
  #   예) 9못이김을 num_tasks와 별도 커리큘럼으로:
  #       global_rule:
  #         curriculum:
  #           - name: off
  #             completion_criteria: { measure: reward, behavior: CrewAgent, threshold: 0.8, min_lesson_length: 100 }
  #             value: 0
  #           - name: nine
  #             value: 2
  # ──────────────────────────────────────────────
