behaviors:
  CrewAgent:
    # MA-POCA: 4명을 한 팀으로 묶어 group reward + 중앙집중 critic으로 협력 학습.
    #   GameManager가 helperHeuristicOnly가 아니면 SimpleMultiAgentGroup에 4명 등록.
    #   (씬: 4명 모두 BehaviorType=Default)
    trainer_type: poca
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 0.01          # 엔트로피 계수 (협동게임은 탐색 중요)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 5

# ──────────────────────────────────────────────
# 커리큘럼 학습 — task 개수를 1개부터 점차 늘린다.
#   MissionManager.StartTaskSelectionPhase()에서
#   Academy.EnvironmentParameters.GetWithDefault("num_tasks", 1)로 읽는다.
#
#   각 task = WinSpecificCard("지정 색깔+숫자 카드가 든 트릭을 소유자가 이긴다").
#   task는 함장부터 시계방향 드래프트로 배정(가져가기/패스, 정책이 학습).
#
#   보상(그룹): task 완수 +1 / 실패 -1 (실패 시 즉시 미션 종료).
#   → 에피소드 그룹 리턴 ≈ (완수 task 수) - (실패 시 1). num_tasks개 모두 완수 시 +num_tasks.
#
#   진급 기준(threshold)은 그룹 평균 보상. num_tasks=1에서 mean=2*성공률-1 이므로
#   0.6 ≈ 성공률 80%. 단계가 올라갈수록 천장이 커지되 난이도도 오르므로 값은 튜닝 대상.
# ──────────────────────────────────────────────
environment_parameters:
  num_tasks:
    curriculum:
      - name: Stage1_1task
        completion_criteria:
          measure: reward
          behavior: CrewAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 1

      - name: Stage2_2tasks
        completion_criteria:
          measure: reward
          behavior: CrewAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8
        value: 2

      - name: Stage3_3tasks
        completion_criteria:
          measure: reward
          behavior: CrewAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1.0
        value: 3

      - name: Stage4_4tasks
        value: 4

  # ──────────────────────────────────────────────
  # 특수 규칙 env 플래그 (Simulation 학습에서 켜면 합성 미션으로 적용 + 관측 노출).
  #   MissionManager.BuildSyntheticMissionFromEnv()가 읽어 currentMission에 주입 →
  #   enforce(CheckGlobalRule/통신/카드교환/순서토큰)·관측(특수규칙 32칸) 모두 동작.
  #   기본 0 = 규칙 없음(순수 트릭+드래프트 베이스). 각 항목 fixed value 또는 curriculum 가능.
  #
  #   global_rule:          0 없음 / 1~9 = GlobalMissionRule
  #                         (1 AllRocketsMustWin·2 NoNineWins·3 RocketOneWinsTwice·4 BalanceTricks·
  #                          5 RocketsInOrder·6 CommanderFirstAndLast·7 OmegaOnLastTrick·
  #                          8 OnePlayerFirstFourOnly·9 LeftOfPinkNineWinsAllPink)
  #   order_token_mode:     0 없음 / 1 숫자(①②) / 2 Ω / 3 화살표(›››)
  #   dead_zone:            1 = 통신 위치(최고/유일/최저) 비공개
  #   comm_disrupt_until:   N = N번째 트릭 전까지 통신 금지 (⚡N)
  #   no_comm_player:       1 = 특정인(사령관 왼쪽) 통신 불가 (M11)
  #   card_pass_after_first:1 = 첫 트릭 후 카드 1장 전달 (M12)
  #
  #   ※ commander_decision/distribution은 드래프트 흐름 변경이라 미구현(관측만). 추후 통합.
  #   예) 9못이김을 num_tasks와 별도 커리큘럼으로:
  #       global_rule:
  #         curriculum:
  #           - name: off
  #             completion_criteria: { measure: reward, behavior: CrewAgent, threshold: 0.8, min_lesson_length: 100 }
  #             value: 0
  #           - name: nine
  #             value: 2
  # ──────────────────────────────────────────────
