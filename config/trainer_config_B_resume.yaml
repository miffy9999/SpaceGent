behaviors:
  CrewAgent:
    trainer_type: poca
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000   # build_run7_B(10M) --resume → 추가 10M 착취(ε=0 고정)
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 5

# ──────────────────────────────────────────────
# B_resume — build_run7_B 체크포인트 이어받기 전용 설정
#
# 배경:
#   build_run7_B(Run7-B)가 10M에서 종료됐을 때 ε=0 구간(9.7M~)이 ~300k뿐.
#   success_by_assignee 37.1%(draftE 33.4% 초과), entropy 0.650, 상승 기울기 미꺾임.
#   착취 budget 부족이 유일한 병목 → ε=0 고정 10M 추가 착취.
#
# 실행:
#   mlagents-learn config/trainer_config_B_resume.yaml \
#     --env=<run7_B빌드> --run-id=build_run7_B --resume
#
# 주의:
#   - draft_explore_eps: 체크포인트에 lesson_num=2(Eps_Zero)가 저장됨.
#     3단계 구조를 없애면 curriculum[2] IndexError 발생(draftE_resume와 동일 문제).
#     → 구조 유지 + 모든 value=0.0으로 교체.
#   - mix_tasks=1: 혼합 N 샘플링 유지(40/35/15/10%). 체크포인트와 동일 환경.
#   - num_tasks=1: mix_tasks=1이면 무시되나 안전 기본값 유지.
# ──────────────────────────────────────────────
environment_parameters:
  mix_tasks: 1              # 혼합 N 샘플링 유지 (lesson_num=0, 고정값)
  num_tasks: 1              # mix_tasks=1이면 무시됨 (lesson_num=0, 고정값)

  # ε=0 고정: --resume 착취 전용.
  #   체크포인트에 lesson_num=2(Eps_Zero)가 저장돼 있으므로 3단계 구조 유지,
  #   값만 모두 0.0으로 교체. 구조를 없애면 curriculum[2] IndexError 발생.
  draft_explore_eps:
    curriculum:
      - name: Eps_Full
        completion_criteria:
          measure: progress
          behavior: CrewAgent
          threshold: 0.5
          min_lesson_length: 10
        value: 0.0
      - name: Eps_Half
        completion_criteria:
          measure: progress
          behavior: CrewAgent
          threshold: 0.8
          min_lesson_length: 10
        value: 0.0
      - name: Eps_Zero
        value: 0.0
