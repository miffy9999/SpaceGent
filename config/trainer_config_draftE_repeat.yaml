behaviors:
  CrewAgent:
    trainer_type: poca
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 5

# ══════════════════════════════════════════════
# draftE_repeat — 드래프트 ε(N=1) 실험의 시드 반복용 설정
#
# 무엇:
#   build_vector313_draftE2(N=1, draft ε, 클린 20M)를 "그대로" 재현하는 설정.
#   멀티시드(평균±표준편차)로 신뢰구간을 얻기 위해, 동일 설정을 --seed만 바꿔 N회 실행.
#
# 어디서:
#   commE 빌드에서 실행(superset). 검증 결과 draftE2와 사실상 동일 동작
#   (유일 차이: N-관측 o[20]=0.1 상수, 학습 무의미). comm_explore_eps=0으로 통신 강제 OFF.
#
# run7_B_repeat와의 관계:
#   유일한 차이는 mix_tasks (여기=0 / run7_B_repeat=1). ε 스케줄·하이퍼파라미터·20M
#   전부 동일 → 두 실험이 깨끗한 대조쌍이 되도록 맞춤.
#
# ε 스케줄 (draftE2와 동일 절대 step):
#   0→5M  (progress 0→0.25): ε=1.0  — cursor 분포 다양화
#   5→8M  (progress 0.25→0.40): ε=0.5
#   8→20M (progress 0.40→1.0):  ε=0.0 — 순수 착취 12M
#
# 실행 (시드 4개 예시; --seed·--run-id·--base-port를 매번 다르게):
#   mlagents-learn config/trainer_config_draftE_repeat.yaml --env=<commE빌드> \
#     --run-id=draftE_repeat_s1 --seed 1 --base-port 5005
#   ... --run-id=draftE_repeat_s2 --seed 2 --base-port 5010
#   ... --run-id=draftE_repeat_s3 --seed 3 --base-port 5015
#   ... --run-id=draftE_repeat_s4 --seed 4 --base-port 5020
#   ※ run 종료 후 results/<run-id>/ 폴더 전체(.onnx + .pt + configuration.yaml) 보관.
# ══════════════════════════════════════════════
environment_parameters:
  num_tasks: 1     # N=1 고정 (curriculum 금지 — progress 기반 N 전환 방지)
  mix_tasks: 0     # 혼합 N OFF (명시) — 이 값이 run7_B_repeat와의 유일한 차이
  comm_explore_eps: 0.0   # 통신 강제 OFF (명시) — draftE2와 동일하게 통신은 정책 자율

  draft_explore_eps:
    curriculum:
      - name: Eps_Full
        completion_criteria:
          measure: progress
          behavior: CrewAgent
          threshold: 0.25   # 5M/20M
          min_lesson_length: 10
        value: 1.0
      - name: Eps_Half
        completion_criteria:
          measure: progress
          behavior: CrewAgent
          threshold: 0.40   # 8M/20M
          min_lesson_length: 10
        value: 0.5
      - name: Eps_Zero
        value: 0.0          # 8M→20M ε=0 착취 (12M)
